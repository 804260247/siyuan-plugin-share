version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: php-site/Dockerfile
    image: siyuan-share-web:latest
    container_name: siyuan-share-web
    ports:
      - "8080:80"
    volumes:
      # 使用 named volume 而不是 bind mount,避免 NAS 文件系统权限问题
      - storage-data:/var/www/html/storage
      - uploads-data:/var/www/html/uploads
      # 配置文件仍然从主机挂载 (只读)
      - ./php-site/config.php:/var/www/html/config.php:ro
      # nginx 主配置（只读挂载）：改完 `docker compose up -d` 即生效，无需重建镜像
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      # OCR 临时图片共享卷（与 ocr 服务共用）
      - ocr-data:/ocr
    environment:
      - TZ=Asia/Shanghai
      # ---- 网盘 OCR sidecar 开关（可选）----
      # 打开后全文索引/搜索优先走 ocr 服务的 PaddleX serving（高精度中文 OCR）；
      # 注释掉（关闭）即自动回退镜像内置 tesseract，功能不中断、精度略低。
      # - NETDISK_OCR_SIDECAR=1
      # - NETDISK_OCR_SIDECAR_URL=http://ocr:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---- 网盘全文索引 OCR sidecar（PaddleX serving，可选）----
  # NAS 注意：模型缓存用 named volume（ocr-models）而非 bind mount，
  # 避免 NAS 网络文件系统权限/性能问题（与 storage/uploads 同策略）。
  # 首次启动会 pip 安装 paddlex 并下载/转换 OCR 模型（约 1-3 GB、10-30 分钟）。
  ocr:
    image: python:3.11-slim
    container_name: siyuan-share-ocr
    command: ["bash", "/opt/ocr/init.sh"]
    volumes:
      # 启动脚本（仓库内维护，只读挂载）
      - ./deploy/ocr/init.sh:/opt/ocr/init.sh:ro
      # 模型/配置缓存（PADDLEX_HOME），named volume 持久化，重建容器不重复下载
      - ocr-models:/root/.paddlex
      # 与 web 共用的 OCR 临时图片卷
      - ocr-data:/ocr
    environment:
      - TZ=Asia/Shanghai
      - OCR_ENGINE=${OCR_ENGINE:-onnxruntime}
      - OCR_DEVICE=${OCR_DEVICE:-cpu}
      - OCR_PORT=${OCR_PORT:-8080}
      # low=2 线程+关内存竞技场（默认，防低配 OOM）；high=4 线程吞吐优先
      - OCR_PROFILE=${OCR_PROFILE:-low}
      - OCR_THREADS=${OCR_THREADS:-}
      # 可选：pip 国内镜像源，如 https://pypi.tuna.tsinghua.edu.cn/simple
      - OCR_PIP_INDEX=${OCR_PIP_INDEX:-}
    # ---- 资源限制（低配 NAS 默认值；建议档位）----
    #   2GB 内存 : OCR_PROFILE=low , OCR_MEM_LIMIT=1500m, OCR_MEM_RESERVATION=768m, OCR_CPUS=1.0
    #   4GB 内存 : OCR_PROFILE=low , OCR_MEM_LIMIT=2500m, OCR_MEM_RESERVATION=1g,   OCR_CPUS=1.5
    #   8GB+     : OCR_PROFILE=high, OCR_MEM_LIMIT=4g,    OCR_MEM_RESERVATION=1500m, OCR_CPUS=2.0
    mem_limit: ${OCR_MEM_LIMIT:-1500m}
    mem_reservation: ${OCR_MEM_RESERVATION:-768m}
    cpus: ${OCR_CPUS:-1.0}
    restart: unless-stopped

# 使用 named volumes 存储数据
# Docker 会自动管理这些 volume 的权限,兼容各种 NAS 文件系统
volumes:
  storage-data:
    driver: local
  uploads-data:
    driver: local
  ocr-data:
    driver: local
  ocr-models:
    driver: local
