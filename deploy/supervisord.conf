[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
startsecs=2
stderr_logfile=/var/log/supervisor/php-fpm.log
stdout_logfile=/var/log/supervisor/php-fpm.log

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
startsecs=2
stderr_logfile=/var/log/supervisor/nginx.log
stdout_logfile=/var/log/supervisor/nginx.log

; 常驻索引/OCR Worker：持续消费 netdisk_index_jobs 与 OCR 队列，
; 异常退出时由 supervisord 自动拉起。
[program:nd-worker]
command=php /var/www/html/nd-worker.php
user=www-data
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=10
stderr_logfile=/var/log/supervisor/nd-worker.log
stdout_logfile=/var/log/supervisor/nd-worker.log
