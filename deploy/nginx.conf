# 静态资源可读性：nginx worker 与 php-fpm 使用同一个 uid(www-data)，
# 避免宿主机 clone 受 umask 影响（目录 750 / 文件 640）时 nginx 读不到 assets/*。
# nginx 的 try_files 在 access() 失败时会回落到 index.php，表现为
# /assets/style.css 返回 HTML 404 页、页面只剩文字。
user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;
    server_tokens off;

    # worker 已降权到 www-data，/var/lib/nginx/tmp 可能不可写，临时目录统一放 /tmp。
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    access_log /var/log/nginx/access.log;

    # 部署标记：用于从外部确认容器确实加载了本配置。
    add_header X-Share-Web "wwwdata-conf-1" always;

    include /etc/nginx/conf.d/*.conf;
}
